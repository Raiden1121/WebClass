<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Layout</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #4db3f2;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      background-color: white;
      border-radius: 12px;
      padding: 18px;
      display: grid;
      gap: 10px;
    }

    .header {
      background-color: #a8d83f;
      height: 130px;
    }

    .content {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .content div {
      background-color: #08b9c4;
      height: 160px;
    }

    .footer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .footer div {
      background-color: #e8eff1;
      height: 90px;
    }

    /* When viewport width is less than 480px */
    @media (max-width: 479px) {
      body {
        padding: 18px;
      }

      .container {
        width: 100%;
        max-width: 360px;
      }

      .header {
        height: 110px;
      }

      .content {
        grid-template-columns: 1fr;
      }

      .content div {
        height: 70px;
      }

      .footer {
        grid-template-columns: repeat(2, 1fr);
      }

      .footer div {
        height: 55px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"></div>

    <div class="content">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <div class="footer">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>
</body>
</html>
