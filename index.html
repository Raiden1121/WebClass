<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebClass HTML 清單</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f5f7fb;
			--panel: #ffffff;
			--text: #1f2937;
			--muted: #6b7280;
			--accent: #0f766e;
			--accent-soft: #d9f0ec;
			--border: #dbe3ea;
			--shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: linear-gradient(180deg, #eef4f8 0%, var(--bg) 100%);
			color: var(--text);
			display: grid;
			place-items: center;
			padding: 24px;
		}

		main {
			width: min(720px, 100%);
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 20px;
			box-shadow: var(--shadow);
			padding: 28px;
		}

		h1 {
			margin: 0 0 8px;
			font-size: clamp(1.6rem, 3vw, 2.2rem);
		}

		p {
			margin: 0 0 20px;
			color: var(--muted);
			line-height: 1.6;
		}

		ul {
			list-style: none;
			margin: 0;
			padding: 0;
			display: grid;
			gap: 12px;
		}

		li a {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			padding: 14px 16px;
			border: 1px solid var(--border);
			border-radius: 14px;
			text-decoration: none;
			color: var(--text);
			background: #fff;
			transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
		}

		li a:hover,
		li a:focus-visible {
			transform: translateY(-1px);
			border-color: var(--accent);
			background: var(--accent-soft);
			outline: none;
		}

		.file-name {
			font-weight: 600;
		}

		.file-hint {
			color: var(--muted);
			font-size: 0.95rem;
			white-space: nowrap;
		}
	</style>
</head>
<body>
	<main>
		<h1>WebClass HTML 檔案清單</h1>
		<p>點選下方任一項目即可開啟對應的 HTML 檔案。</p>
		<ul>
			<li><a href="button_toggle.html"><span class="file-name">button_toggle.html</span><span class="file-hint"></span></a></li>
			<li><a href="css_table.html"><span class="file-name">css_table.html</span><span class="file-hint"></span></a></li>
			<li><a href="overflow.html"><span class="file-name">overflow.html</span><span class="file-hint"></span></a></li>
			<li><a href="styling_images.html"><span class="file-name">styling_images.html</span><span class="file-hint"></span></a></li>
			<li><a href="rwd.html"><span class="file-name">rwd.html</span><span class="file-hint"></span></a></li>
			<li><a href="bootstrap.html"><span class="file-name">bootstrap.html</span><span class="file-hint"></span></a></li>
			<li><a href="index.html"><span class="file-name">index.html</span><span class="file-hint"></span></a></li>
		</ul>
	</main>
</body>
</html>
