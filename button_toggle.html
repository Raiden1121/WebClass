<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer-Designer Collaboration Task</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f6f6f6;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            border: 1px solid #eaeaea;
            width: 496px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* ===== 新增：Header（預覽 + 按鈕） ===== */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 18px 0 18px;
        }

        .preview-text {
            font-size: 13px;
            color: #2f2f2f;
        }

        /* Image */
        .image-container {
            position: relative;
            width: 450px;
            height: 240px;
            margin: 20px auto;
            background-color: #ddd;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Button（取消 absolute） */
        .spec-button {
            position: static;
            height: 22px;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid #2f2f2f;
            color: #2f2f2f;
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            padding: 0 12px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            outline: none;
        }

        .spec-button:hover {
            background-color: #f3f3f3;
        }

        .spec-button:active {
            background-color: #e8e8e8;
        }

        .info-row {
            display: flex;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .label {
            color: #2f2f2f;
            font-weight: bold;
            width: 100px;
        }

        .value {
            color: #707070;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">


    <div class="header-bar">
        <span class="preview-text">預覽</span>
        <button id="toggleBtn" class="spec-button">查看資訊</button>
    </div>

    <!-- 圖片 -->
    <div class="image-container">
        <img src="https://picsum.photos/450/240" alt="Preview" class="main-image">
    </div>

    <!-- 資訊 -->
    <div id="infoPanel" class="info-panel">
        <div class="status-bar" style="width: 100%;"></div>
        <div class="status-bar" style="width: 80%;"></div>
        
        <div class="info-row">
            <span class="label">修改日期:</span>
            <span class="value">2017/10/12</span>
        </div>
        <div class="info-row">
            <span class="label">類型:</span>
            <span class="value">JPG</span>
        </div>
        <div class="info-row">
            <span class="label">大小:</span>
            <span class="value">466.97KB</span>
        </div>
        <div class="info-row">
            <span class="label">路徑:</span>
            <span class="value">\\designcenter.qnap.com.tw\DesignCenter\PM-RD\WEB\Sample</span>
        </div>
    </div>

</div>

<script>
    const btn = document.getElementById('toggleBtn');
    const panel = document.getElementById('infoPanel');

    btn.addEventListener('click', () => {
        const isVisible = panel.style.display === 'block';
        
        if (isVisible) {
            panel.style.display = 'none';
            btn.textContent = '查看資訊';
        } else {
            panel.style.display = 'block';
            btn.textContent = '收起資訊';
        }
    });
</script>

</body>
</html>
